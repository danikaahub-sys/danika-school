<!doctype html>
<html lang="fa" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Danika School</title>
    <meta name="title" content="Danika School" />
    <meta name="description" content="Danika School admin dashboard." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Danika School" />
    <meta property="og:description" content="Danika School admin dashboard." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Danika School" />
    <meta
      property="twitter:description"
      content="Danika School admin dashboard."
    />

    <!-- fonts -->
    <link
      rel="preload"
      href="/fonts/iranyekanwebregularfanum.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/iranyekanwebboldfanum.woff"
      as="font"
      type="font/woff"
      crossorigin
    />

    <meta name="theme-color" content="#fff" />
  </head>

  <!-- dir on body (not html) keeps the page scrollbar on the physical right in RTL -->
  <body dir="rtl">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
